<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Sion Book</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --blue: #0a3df0; --blue-2: #001fb5; --navy: #0a1f6b; --cyan: #00a3e0; --ink: #1f2433; --muted: #5d6680;
    --line: #d5dcee; --bg: #eef2fb; --card: #fff; --ok: #0a7a3d; --warn: #b45309; --bad: #b42318;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 6px 18px -14px #0a1f6b; }
  header.top img { height: 40px; }
  header.top h1 { font-size: 17px; margin: 0; font-weight: 650; color: var(--navy); }
  .spacer { flex: 1; }
  .state { font-size: 13px; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--bg); }
  .state.dirty { background: #fff4e0; color: var(--warn); font-weight: 600; }
  button, .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 8px 14px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .btn:hover { border-color: var(--blue); color: var(--blue); }
  button.primary { background: linear-gradient(180deg, var(--blue), var(--blue-2)); border-color: var(--blue-2); color: #fff; font-weight: 600; }
  button.primary:hover { color: #fff; filter: brightness(1.08); }
  button.danger { color: var(--bad); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  button.small { padding: 4px 9px; font-size: 13px; }
  nav.tabs { display: flex; gap: 4px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 12px 16px; background: none; font-weight: 600; color: var(--muted); }
  nav.tabs button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
  main { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; color: var(--navy); }
  .card h3 { margin: 22px 0 10px; font-size: 14px; color: var(--navy); text-transform: uppercase; letter-spacing: .06em; padding-top: 14px; border-top: 1px solid var(--line); }
  .card h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .list { display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
  .item[aria-current="true"] { border-color: var(--blue); box-shadow: 0 0 0 2px #0a3df022; }
  .thumb { width: 44px; height: 66px; border-radius: 3px; background: var(--navy) center/cover no-repeat; box-shadow: 0 2px 6px #0004; }
  .item b { display: block; line-height: 1.25; font-size: 14px; }
  .item small { color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #e3e9fb; color: var(--blue-2); margin-right: 3px; }
  .badge.off { background: #f1f1f1; color: #aaa; text-decoration: line-through; }
  .mv { display: grid; gap: 2px; }
  .mv button { padding: 0 7px; line-height: 1.2; font-size: 11px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
  @media (max-width: 700px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  label.f { display: block; font-size: 13px; font-weight: 600; color: var(--ink); }
  label.f span.hint { font-weight: 400; color: var(--muted); }
  label.f input, label.f textarea, label.f select { display: block; width: 100%; margin-top: 4px; font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  label.f input:focus, label.f textarea:focus, label.f select:focus { outline: 2px solid #0a3df044; border-color: var(--blue); }
  label.f textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  label.f input[type=color] { padding: 2px; height: 38px; }
  .lang-tag { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: var(--cyan); padding: 0 6px; border-radius: 4px; margin-right: 4px; vertical-align: 1px; }
  .lang-tag.pt { background: #0a7a3d; }
  .where { display: flex; gap: 12px; flex-wrap: wrap; }
  .where label { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 600; background: #fff; }
  .where label:has(input:checked) { border-color: var(--blue); background: #eef2ff; }
  .where input { width: 18px; height: 18px; }
  .covers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .cover-box { display: flex; gap: 14px; align-items: flex-start; }
  .cover-box .thumb { width: 96px; height: 144px; flex: none; }
  .cover-info { font-size: 13px; color: var(--muted); }
  .cover-info .ok { color: var(--ok); } .cover-info .warn { color: var(--warn); }
  .note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  pre.log { background: #0e1630; color: #d8e1ff; padding: 14px; border-radius: 10px; overflow: auto; max-height: 280px; font-size: 12.5px; white-space: pre-wrap; margin: 12px 0 0; }
  .toast { position: fixed; right: 20px; bottom: 20px; max-width: 420px; padding: 12px 16px; border-radius: 10px; background: var(--navy); color: #fff; box-shadow: 0 12px 30px -8px #0008; z-index: 50; }
  .toast.bad { background: var(--bad); } .toast.good { background: var(--ok); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stat { display: flex; gap: 22px; flex-wrap: wrap; margin: 4px 0 14px; }
  .stat div b { display: block; font-size: 24px; color: var(--navy); }
  .adv summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .login { max-width: 400px; margin: 8vh auto 0; }
  .login .f + .f { margin-top: 14px; }
  .login .err { color: var(--bad); font-size: 14px; min-height: 20px; margin: 10px 0 0; }
  .login pre { background: #f4f6fd; border: 1px solid var(--line); padding: 10px; border-radius: 8px; font-size: 12.5px; white-space: pre-wrap; }
  [hidden] { display: none !important; }
  body[data-lang="es"] { --lc: #0090c8; --lc-bg: #e6f6fd; }
  body[data-lang="pt"] { --lc: #0a7a3d; --lc-bg: #e7f6ee; }
  .langsw { display: flex; gap: 4px; padding: 4px; background: var(--bg); border-radius: 12px; margin-left: 8px; }
  .langsw button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-weight: 700; color: var(--muted); gap: 7px; }
  .langsw button[aria-pressed="true"] { background: #fff; color: var(--lc); box-shadow: 0 1px 6px #0a1f6b33; }
  .langsw .cnt { font-size: 11px; background: #dfe6fb; color: var(--blue-2); border-radius: 999px; padding: 0 7px; }
  .modeband { padding: 9px 24px; font-size: 14px; background: var(--lc-bg, #eef2ff); border-bottom: 3px solid var(--lc, var(--blue)); color: var(--ink); }
  .modeband b { color: var(--lc, var(--blue)); }
  .modehead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 3px solid var(--lc, var(--blue)); margin-bottom: 4px; }
  .st { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .st.ok { background: #e1f5e9; color: #0a7a3d; } .st.miss { background: #fff4e0; color: #b45309; }
  .meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
  .summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .pend { margin-top: 18px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .pend h3 { border: 0; padding: 0; margin: 8px 0 4px; }
  .pitem { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; margin-top: 6px; border: 1px dashed var(--line); border-radius: 8px; background: #fafbff; font-size: 14px; }
  .segbar { display: flex; gap: 4px; padding: 3px; margin: 0 0 12px; background: var(--bg); border-radius: 10px; }
  .seg { flex: 1; justify-content: center; padding: 6px 8px; border: 0; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg.on { background: #fff; color: var(--blue); box-shadow: 0 1px 4px #0a1f6b33; }
  .seg .cnt { margin-left: 5px; font-size: 11px; background: #dfe6fb; color: var(--blue-2); border-radius: 999px; padding: 0 6px; }
  .pgnum { margin-left: 6px; font-size: 12px; color: var(--muted); }
  .pginfo { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 4px; }
  .pginfo .pg { font-size: 13px; padding: 5px 10px; border-radius: 8px; background: #eef2ff; color: var(--blue-2); }
  .pginfo .pg.off { background: #f1f1f1; color: #888; }
  ol.map { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ol.map li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  ol.map li.is-link { cursor: pointer; }
  ol.map li.is-link:hover { border-color: var(--blue); }
  ol.map .n { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #eef2ff; color: var(--blue-2); font-size: 12px; font-weight: 700; }
  ol.map .t { flex: 1; } ol.map .t small { color: var(--muted); }
  ol.map .only { font-size: 11px; font-weight: 700; color: var(--warn); background: #fff4e0; padding: 2px 8px; border-radius: 999px; }
</style>
</head>
<body>
<header class="top">
  <img src="/brand/logo.png" alt="Sion Book">
  <h1>Panel de administración</h1>
  <div class="langsw" id="langsw" role="group" aria-label="Idioma que estás editando">
    <button type="button" data-l="es"><span class="lang-tag es">ES</span>Español<span class="cnt" data-l="es"></span></button>
    <button type="button" data-l="pt"><span class="lang-tag pt">PT</span>Português<span class="cnt" data-l="pt"></span></button>
  </div>
  <span class="spacer"></span>
  <span class="state" id="who" hidden></span>
  <span class="state" id="state">Todo guardado</span>
  <a class="btn" id="site-link" href="http://localhost:3000" target="_blank" rel="noopener">Ver el sitio ↗</a>
  <button class="primary" id="save">Guardar y actualizar</button>
  <button id="logout" hidden>Salir</button>
</header>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="books">Libros</button>
  <button role="tab" data-tab="upcoming">Próximas obras</button>
  <button role="tab" data-tab="map">Comparar ES / PT</button>
  <button role="tab" data-tab="site">Textos de la editorial</button>
  <button role="tab" data-tab="publish">Publicar en sionbook.com</button>
</nav>
<div class="modeband" id="modeband"></div>
<main id="view"></main>
<div id="toasts"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const view = $('#view');
let data = null;           // { books, upcoming, site }
let tab = 'books';
let sel = { books: 0, upcoming: 0 };
let dirty = false;
let git = null;
let lastLog = '';

/* ---------- utilidades ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const slugify = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70);
function toast(msg, kind = '') {
  const t = h('div', { class: 'toast ' + kind }, msg);
  $('#toasts').append(t); setTimeout(() => t.remove(), kind === 'bad' ? 9000 : 4000);
}
async function api(path, opts = {}) {
  // Todas las llamadas van a la misma función: /api/admin/?action=<nombre>
  const m = path.match(/^\/api\/([a-z]+)$/); if (m) path = '/api/admin/?action=' + m[1];
  const r = await fetch(path, { ...opts, headers: { 'x-admin': '1', ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({ ok: false, error: 'Respuesta no válida' }));
  if (!r.ok && !j.log) throw new Error(j.error || 'Error ' + r.status);
  return j;
}
function markDirty() { dirty = true; const s = $('#state'); s.textContent = 'Cambios sin guardar'; s.className = 'state dirty'; }
function markClean() { dirty = false; const s = $('#state'); s.textContent = 'Todo guardado'; s.className = 'state'; }
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

let cloud = false;         // true en sionbook.com/admin; false en el panel local
let etag = null;           // versión de los datos que se abrió (para no pisar cambios hechos desde otro sitio)
const pending = [];        // portadas subidas a GitHub y aún sin publicar: { path, sha }
const previews = {};       // vista previa local de portadas recién subidas (aún no están en la web)
const urlFor = (p) => previews[p] || p;

const fileToBase64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
// Si la imagen es muy grande se reduce (máx. 1800 px de lado, JPG); si ya es razonable, se sube tal cual
async function prepareImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.size <= 1.5 * 1024 * 1024) return file;
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.88));
}

const BOTH = ['es', 'pt'];
const langsOf = (o) => (Array.isArray(o.languages) ? o.languages : BOTH);

/* ---------- campos ---------- */
function field(label, obj, key, { lang, type = 'text', hint, area, onchange, placeholder, options } = {}) {
  const tag = h('span', {}, lang ? h('span', { class: 'lang-tag ' + lang }, lang.toUpperCase()) : null, label, hint ? h('span', { class: 'hint' }, ' · ' + hint) : null);
  let input;
  if (options) {
    input = h('select', {}, options.map((o) => h('option', { value: o, selected: obj[key] === o }, o)));
  } else if (area) input = h('textarea', { placeholder: placeholder || '' }); else input = h('input', { type, placeholder: placeholder || '' });
  if (!options) input.value = obj[key] ?? (type === 'color' ? '#0a2a8a' : '');
  input.addEventListener('input', () => {
    obj[key] = type === 'number' ? input.value : input.value;
    markDirty(); refreshStatus(); if (onchange) onchange(input.value);
  });
  return h('label', { class: 'f' }, tag, input);
}

/* ---------- portadas ---------- */
function coverBox(obj, key, title, slugBase) {
  const thumb = h('div', { class: 'thumb' });
  const info = h('div', { class: 'cover-info' });
  const paint = () => {
    thumb.style.background = obj[key] ? '' : '#dfe6fb';
    if (obj[key]) thumb.style.backgroundImage = `url("${urlFor(obj[key])}")`;
    thumb.style.backgroundSize = 'cover';
    info.innerHTML = obj[key] ? `<div>${obj[key]}</div>` : '<div>Sin portada: el sitio genera una con el título y el color.</div>';
    if (obj[key]) {
      const im = new Image();
      im.onload = () => {
        const ratio = im.naturalWidth / im.naturalHeight;
        const good = Math.abs(ratio - 2 / 3) < 0.03;
        info.insertAdjacentHTML('beforeend', `<div class="${good ? 'ok' : 'warn'}">${im.naturalWidth}×${im.naturalHeight}px ${good ? '✓ proporción 2:3' : '⚠ no es 2:3; se recortará para encajar'}</div>`);
      };
      im.src = urlFor(obj[key]);
    }
  };
  const file = h('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp', style: 'display:none' });
  file.addEventListener('change', async () => {
    const f = file.files[0]; if (!f) return;
    try {
      const base = slugBase() || 'portada';
      const blob = await prepareImage(f);
      const r = await api('/api/upload', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: base, dataBase64: await fileToBase64(blob) }) });
      if (!r.ok) throw new Error(r.error);
      previews[r.path] = URL.createObjectURL(blob);
      if (cloud) pending.push({ path: r.path, sha: r.sha });
      obj[key] = r.path; markDirty(); paint(); toast(`Portada subida (${r.kb} KB)${cloud ? '. Se publicará al guardar.' : ''}`, 'good');
    } catch (e) { toast(e.message, 'bad'); }
    file.value = '';
  });
  paint();
  return h('div', {}, h('label', { class: 'f' }, title),
    h('div', { class: 'cover-box', style: 'margin-top:6px' }, thumb,
      h('div', {}, h('div', { class: 'row' },
        h('button', { type: 'button', onclick: () => file.click() }, obj[key] ? 'Cambiar imagen' : 'Subir imagen'),
        obj[key] ? h('button', { type: 'button', class: 'danger', onclick: () => { obj[key] = ''; markDirty(); paint(); } }, 'Quitar') : null, file),
        info)));
}

/* ---------- idioma de trabajo: Español | Português ---------- */
// El panel se usa "como el sitio": eliges un idioma y ves SOLO lo de ese idioma (sus libros, sus textos y lo que le falta).
let L = (() => { try { return localStorage.getItem('sb_admin_lang') === 'pt' ? 'pt' : 'es'; } catch { return 'es'; } })();
const OTHER = (l) => (l === 'es' ? 'pt' : 'es');
const LANG_NAME = { es: 'español', pt: 'português' };
const LANG_TITLE = { es: 'ESPAÑOL', pt: 'PORTUGUÊS' };
const inLang = (o, l) => langsOf(o).includes(l);
const visible = (kind) => data[kind].map((o, i) => i).filter((i) => inLang(data[kind][i], L));
const sfx = (k, l = L) => (l === 'pt' ? k + '_pt' : k);       // nombre del campo en cada idioma (title / title_pt)
const has = (o, k) => String(o[k] ?? '').trim() !== '';
const titleIn = (o, l) => (l === 'pt' && o.title_pt) || o.title || '(sin título)';
// Número de página de un libro en cada idioma (1 = Inicio, 2 = Catálogo, luego los libros)
const bookPage = (o, l) => (inLang(o, l) ? 3 + data.books.filter((b) => inLang(b, l)).indexOf(o) : null);

// Qué falta por subir/completar en el idioma activo
function missingFor(o, kind, l = L) {
  const m = [];
  if (!has(o, sfx('title', l))) m.push('título');
  const pairs = kind === 'books' ? [['subtitle', 'subtítulo'], ['category', 'categoría']] : [['subtitle', 'subtítulo'], ['note', 'frase corta']];
  for (const [k, label] of pairs) if (!has(o, sfx(k, l)) && has(o, sfx(k, OTHER(l)))) m.push(label);   // lo que ya existe en el otro idioma
  if (kind === 'books') {
    if (!has(o, sfx('description', l))) m.push('sinopsis');
    if (!o.amazonPrint && !o.amazonKindle && !o.googlePlay) m.push('enlaces de compra');
  }
  if (!has(o, 'cover') && !(l === 'pt' && has(o, 'cover_pt'))) m.push('portada');
  return m;
}
const statusChip = (miss) => (miss.length ? h('span', { class: 'st miss' }, 'Falta: ' + miss.join(', ')) : h('span', { class: 'st ok' }, '✓ Completo'));

// Al escribir: actualiza al instante la lista y la etiqueta "Falta: …" / "✓ Completo"
function refreshStatus() {
  if (!data || (tab !== 'books' && tab !== 'upcoming')) return;
  const o = data[tab][sel[tab]]; if (!o) return;
  const chip = document.querySelector('.modehead .st'); if (chip) chip.replaceWith(statusChip(missingFor(o, tab)));
  renderList();
}
function syncLangUI() {
  document.body.dataset.lang = L;
  document.querySelectorAll('#langsw button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === L)));
  const n = (l) => (data ? data.books.filter((b) => inLang(b, l)).length : 0);
  document.querySelectorAll('#langsw .cnt').forEach((c) => { c.textContent = n(c.dataset.l); });
}
function setLang(l) {
  L = l; try { localStorage.setItem('sb_admin_lang', l); } catch {}
  syncLangUI(); render();
}

/* ---------- lista lateral ---------- */
function renderList() {
  const box = $('#listbox'); if (!box) return;
  const arr = data[tab]; const vis = visible(tab); const list = h('div', { class: 'list' });
  vis.forEach((i, pos) => {
    const o = arr[i];
    const th = h('div', { class: 'thumb' }); const img = (L === 'pt' && o.cover_pt) || o.cover;
    if (img) th.style.backgroundImage = `url("${urlFor(img)}")`; else th.style.background = o.color || '#0a2a8a';
    th.style.backgroundSize = 'cover';
    const pg = tab === 'books' ? bookPage(o, L) : null;
    list.append(h('div', { class: 'item', 'aria-current': String(i === sel[tab]), onclick: () => { sel[tab] = i; render(); } },
      th,
      h('div', {}, h('b', {}, titleIn(o, L)), h('small', {}, o.author || ''),
        h('div', { class: 'meta-row' }, statusChip(missingFor(o, tab)), pg ? h('span', { class: 'pgnum' }, `pág. ${pg}`) : null)),
      h('div', { class: 'mv' },
        h('button', { class: 'small', title: 'Subir', disabled: pos === 0, onclick: (e) => { e.stopPropagation(); move(i, -1); } }, '▲'),
        h('button', { class: 'small', title: 'Bajar', disabled: pos === vis.length - 1, onclick: (e) => { e.stopPropagation(); move(i, 1); } }, '▼'))));
  });
  if (!vis.length) list.append(h('div', { class: 'empty' }, `Todavía no hay nada en el sitio en ${LANG_NAME[L]}.`));
  box.replaceChildren(list);
}
// Mover se intercambia con el vecino de ESTE idioma (así el orden de cada idioma queda como lo ves)
function move(i, d) {
  const arr = data[tab]; const vis = visible(tab); const j = vis[vis.indexOf(i) + d];
  if (j === undefined) return;
  [arr[i], arr[j]] = [arr[j], arr[i]]; sel[tab] = j; markDirty(); render();
}

/* ---------- mapa del sitio: las páginas de cada idioma, lado a lado ---------- */
function sitePages(l) {
  const es = l === 'es';
  const up = data.upcoming.filter((u) => inLang(u, l));
  const pages = [{ label: es ? 'Inicio' : 'Início' }, { label: 'Catálogo' }];
  data.books.filter((b) => inLang(b, l)).forEach((b) => pages.push({ label: titleIn(b, l), book: b, only: !inLang(b, OTHER(l)) }));
  if (up.length) pages.push({ label: 'Próximas obras', note: `${up.length} ${up.length === 1 ? 'obra' : 'obras'}`, only: !data.upcoming.some((u) => inLang(u, OTHER(l))) });
  pages.push({ label: es ? 'La editorial' : 'A editora' }, { label: es ? 'Contacto' : 'Contato' }, { label: es ? 'Política de privacidad' : 'Política de privacidade' });
  return pages;
}
function mapView() {
  const cols = ['es', 'pt'].map((l) => ({ l, pages: sitePages(l) }));
  const diff = Math.abs(cols[0].pages.length - cols[1].pages.length);
  const col = ({ l, pages }) => h('div', { class: 'card' },
    h('h2', {}, h('span', { class: 'lang-tag ' + l }, l.toUpperCase()), `Sitio en ${LANG_NAME[l]}`),
    h('div', { class: 'stat' }, h('div', {}, h('b', {}, pages.length), 'páginas')),
    h('ol', { class: 'map' }, pages.map((p, i) => h('li', { class: p.book ? 'is-link' : '', onclick: p.book ? () => { L = l; try { localStorage.setItem('sb_admin_lang', l); } catch {} tab = 'books'; sel.books = data.books.indexOf(p.book); syncLangUI(); render(); } : null },
      h('span', { class: 'n' }, i + 1), h('span', { class: 't' }, p.label, p.note ? h('small', {}, ` · ${p.note}`) : null),
      p.only ? h('span', { class: 'only' }, `solo en ${l.toUpperCase()}`) : null))));
  return h('div', {},
    h('p', { class: 'note', style: 'margin:0 0 14px' }, diff || cols.some((c) => c.pages.some((p) => p.only))
      ? `El sitio en español (${cols[0].pages.length} páginas) y el sitio en português (${cols[1].pages.length} páginas) no tienen las mismas páginas. Las marcadas “solo en ES / PT” existen en un único idioma. Toca un libro para editarlo en su idioma.`
      : 'Los dos idiomas tienen las mismas páginas. Toca un libro para editarlo.'),
    h('div', { class: 'grid2' }, cols.map(col)));
}

/* ---------- editor de libro / próxima obra (en el idioma activo) ---------- */
function editor(kind) {
  const arr = data[kind]; const o = arr[sel[kind]];
  const noun = kind === 'books' ? 'libros' : 'próximas obras';
  if (!o || !visible(kind).includes(sel[kind])) return h('div', { class: 'card empty' }, `Todavía no hay ${noun} en el sitio en ${LANG_NAME[L]}. Añade uno nuevo, o trae uno del otro idioma desde la lista de la izquierda.`);
  const isBook = kind === 'books';
  const miss = missingFor(o, kind);
  const k = (base) => sfx(base);

  // Al crear algo nuevo se generan solos el título base y la dirección web
  const onTitle = (v) => {
    if (o._new) {
      if (L === 'pt' && !o._titleEsTouched) o.title = v;                                      // el título base (obligatorio) sigue al texto en portugués si aún no existe en español
      if (isBook) {
        if (L === 'es' && !o._slugTouched) { o.slug = slugify(v); const el = $('#slugbox input'); if (el) el.value = o.slug; }
        if (L === 'pt') {
          if (!o._slugTouched) o.slug = slugify(v);
          if (!o._slugPtTouched) { o.slug_pt = slugify(v); const el = $('#slugbox input'); if (el) el.value = o.slug_pt; }
        }
      }
    }
    renderList();
  };

  const card = h('div', { class: 'card' });
  card.append(
    h('div', { class: 'modehead' }, h('span', { class: 'lang-tag ' + L }, L.toUpperCase()), h('b', {}, `Editando en ${LANG_NAME[L]}`), statusChip(miss),
      isBook ? h('span', { class: 'pgnum' }, `Página ${bookPage(o, L)} del sitio en ${LANG_NAME[L]}`) : h('span', { class: 'pgnum' }, `Aparece en “Próximas obras” del sitio en ${LANG_NAME[L]}`)),
    h('h3', {}, `Texto en ${LANG_NAME[L]}`),
    h('div', { class: 'grid2' },
      field('Título', o, k('title'), { onchange: onTitle }),
      field('Subtítulo', o, k('subtitle')),
      ...(isBook
        ? [field('Categoría', o, k('category'), { placeholder: L === 'es' ? 'Ej.: Comentario doctrinal' : 'Ex.: Comentário doutrinário' })]
        : [field('Frase corta', o, k('note'), { hint: 'aparece bajo el subtítulo' }), field('Fecha estimada', o, k('when'), { placeholder: L === 'es' ? 'Ej.: otoño 2026' : 'Ex.: outono de 2026' })])));
  if (isBook) card.append(h('div', { style: 'margin-top:14px' }, field('Sinopsis', o, k('description'), { area: true, hint: 'separa los párrafos con una línea en blanco' })));

  // Portada: en español la portada general; en português una propia (opcional) o la misma del español
  card.append(h('h3', {}, 'Portada'));
  const base = () => (isBook ? o.slug : 'proxima-' + slugify(o.title));
  if (L === 'es') {
    card.append(coverBox(o, 'cover', 'Portada (se usa también en português si no subes otra allí)', () => base()),
      h('p', { class: 'note' }, 'Ideal: 800×1200 px (proporción 2:3), JPG, PNG o WebP.'));
  } else {
    card.append(coverBox(o, 'cover_pt', 'Portada para el sitio en português', () => base() + '-pt'),
      h('p', { class: 'note' }, o.cover ? 'Es opcional: si no subes ninguna, el sitio en português usa la misma portada que el español.' : 'Todavía no hay portada en ninguno de los dos idiomas.'));
  }

  // Datos que son iguales en los dos idiomas
  card.append(h('h3', {}, 'Datos comunes (iguales en español y português)'),
    h('div', { class: 'grid3' },
      field('Autor', o, 'author'),
      ...(isBook ? [field('Idioma del libro', o, 'language', { options: ['Español', 'Português'] }), field('Año', o, 'year', { type: 'number' }), field('Páginas', o, 'pages', { type: 'number' }), field('ISBN', o, 'isbn')] : []),
      field('Color de la tapa', o, 'color', { type: 'color', hint: 'si no hay imagen' })));
  if (isBook) {
    card.append(h('h3', {}, 'Dónde comprarlo (iguales en los dos idiomas)'),
      h('div', { class: 'grid3' },
        field('Amazon (papel)', o, 'amazonPrint', { placeholder: 'https://…' }),
        field('Amazon (Kindle)', o, 'amazonKindle', { placeholder: 'https://…' }),
        field('Google Play Libros', o, 'googlePlay', { placeholder: 'https://…' })),
      h('p', { class: 'note' }, 'Los enlaces vacíos se muestran como “Próximamente” / “Em breve”.'),
      h('details', { class: 'adv', style: 'margin-top:18px' }, h('summary', {}, `Opciones avanzadas (dirección web en ${LANG_NAME[L]})`),
        h('div', { id: 'slugbox', style: 'margin-top:10px;max-width:420px' }, field(`Dirección web (${LANG_NAME[L]})`, o, sfx('slug'), { hint: 'solo minúsculas, números y guiones', onchange: () => { if (L === 'es') o._slugTouched = true; else o._slugPtTouched = true; } })),
        h('p', { class: 'note' }, 'Se genera sola a partir del título al crear el libro. Cambiarla en un libro ya publicado cambia su dirección en Google.')));
  }

  // Visibilidad en ESTE idioma + eliminar
  const show = h('input', { type: 'checkbox' }); show.checked = true;
  show.addEventListener('change', () => {
    if (!show.checked && langsOf(o).length === 1) { show.checked = true; toast('Es lo único que lo muestra. Para quitarlo de todo el sitio usa “Eliminar”.', 'bad'); return; }
    o.languages = langsOf(o).filter((x) => x !== L); markDirty(); render();
  });
  card.append(h('h3', {}, 'Visibilidad'),
    h('div', { class: 'where' }, h('label', {}, show, h('span', { class: 'lang-tag ' + L }, L.toUpperCase()), `Mostrar en el sitio en ${LANG_NAME[L]}`)),
    h('p', { class: 'note' }, `Si lo desmarcas, deja de aparecer en el sitio en ${LANG_NAME[L]} (pasa a “Solo en ${LANG_NAME[OTHER(L)]}” en la lista) y no se borra nada.`),
    h('button', { class: 'danger', style: 'margin-top:10px', onclick: () => {
      if (!confirm(`¿Eliminar “${o.title || 'sin título'}” de TODO el sitio (español y português)? Podrás recuperarlo desde las copias en admin/.backups.`)) return;
      arr.splice(sel[kind], 1); sel[kind] = Math.max(0, sel[kind] - 1); markDirty(); render();
    } }, isBook ? 'Eliminar este libro de todo el sitio' : 'Eliminar esta obra de todo el sitio'));
  return card;
}

function listPane(kind) {
  const isBook = kind === 'books';
  const add = h('button', { class: 'primary', style: 'width:100%;justify-content:center;margin-bottom:12px', onclick: () => {
    // Lo nuevo nace solo en el idioma que estás viendo
    const base = isBook
      ? { slug: '', title: '', author: data.site.editor || '', language: L === 'pt' ? 'Português' : 'Español', category: '', color: '#0a2a8a', cover: '', description: '', amazonPrint: '', amazonKindle: '', googlePlay: '', languages: [L], _new: true }
      : { title: '', author: data.site.editor || '', color: '#0a2a8a', cover: '', languages: [L], _new: true };
    data[kind].push(base); sel[kind] = data[kind].length - 1; markDirty(); render();
  } }, `${isBook ? '＋ Añadir libro' : '＋ Añadir próxima obra'} en ${LANG_NAME[L]}`);

  const vis = visible(kind);
  const incomplete = vis.filter((i) => missingFor(data[kind][i], kind).length).length;
  const head = h('p', { class: 'summary' }, `${vis.length} ${isBook ? (vis.length === 1 ? 'libro' : 'libros') : (vis.length === 1 ? 'obra' : 'obras')} en ${LANG_NAME[L]}`,
    incomplete ? h('span', { class: 'st miss' }, `${incomplete} por completar`) : (vis.length ? h('span', { class: 'st ok' }, '✓ todo completo') : null));

  // Lo que existe solo en el otro idioma y se puede traer a este
  const pend = data[kind].map((o, i) => i).filter((i) => !inLang(data[kind][i], L));
  const pendBox = pend.length ? h('div', { class: 'pend' }, h('h3', {}, `Solo en ${LANG_NAME[OTHER(L)]} (${pend.length})`),
    h('p', { class: 'note' }, `Todavía no están en el sitio en ${LANG_NAME[L]}. Puedes traerlos y completar su texto.`),
    pend.map((i) => h('div', { class: 'pitem' }, h('span', {}, titleIn(data[kind][i], OTHER(L))),
      h('button', { class: 'small', onclick: () => { data[kind][i].languages = [...langsOf(data[kind][i]), L]; sel[kind] = i; markDirty(); render(); } }, `Añadir al sitio en ${LANG_NAME[L]}`)))) : null;

  return h('div', { class: 'card' }, h('h2', {}, `${isBook ? 'Libros' : 'Próximas obras'} en ${LANG_NAME[L]}`), add, head, h('div', { id: 'listbox' }),
    h('p', { class: 'note' }, `Este es el orden del sitio en ${LANG_NAME[L]}. Usa ▲ ▼ para cambiarlo; el otro idioma no se toca.`), pendBox);
}

/* ---------- textos de la editorial (del idioma activo) ---------- */
function siteView() {
  const s = data.site; const o = s[L];
  const ta = h('textarea', {}); ta.value = (o.about || []).join('\n\n');
  ta.addEventListener('input', () => { o.about = ta.value.split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean); markDirty(); });
  return h('div', { class: 'card' },
    h('h3', {}, `Textos del sitio en ${LANG_NAME[L]}`),
    h('div', { class: 'grid2' },
      h('div', {},
        field('Frase principal', o, 'tagline'), h('div', { style: 'height:14px' }),
        field('Descripción corta', o, 'description', { area: true }), h('div', { style: 'height:14px' }),
        field('Cargo del editor', o, 'editorTitle')),
      h('div', {},
        h('label', { class: 'f' }, h('span', {}, 'Texto de “La editorial”', h('span', { class: 'hint' }, ' · párrafos separados por una línea en blanco')), ta), h('div', { style: 'height:14px' }),
        field('Texto de Contacto', o, 'contactIntro', { area: true }))),
    h('h3', {}, 'Datos generales (iguales en español y português)'),
    h('div', { class: 'grid2' }, field('Editor', s, 'editor'), field('Correo de contacto', s, 'email', { type: 'email' })),
    h('h3', {}, 'Formulario de contacto (el mismo en los dos idiomas)'),
    h('div', { class: 'grid2' },
      field('Enlace del formulario', s, 'contactEndpoint', { hint: 'Formspree o Web3Forms', placeholder: 'https://formspree.io/f/xxxxxxxx' }),
      field('Clave pública de Web3Forms', s, 'contactAccessKey', { hint: 'solo si usas Web3Forms' })),
    h('p', { class: 'note' }, 'Mientras el enlace esté vacío, la página de contacto solo muestra el botón de correo. Al pegarlo, aparece el formulario.'));
}

/* ---------- publicar ---------- */
async function refreshGit() { try { git = await api('/api/git'); } catch { git = null; } }
function publishView() {
  const msg = h('input', { type: 'text', placeholder: 'Ej.: Añadido el libro nuevo', style: 'width:100%' });
  msg.className = '';
  const out = h('pre', { class: 'log', style: 'display:none' });
  const btn = h('button', { class: 'primary', onclick: async () => {
    if (dirty) { toast('Primero pulsa “Guardar y actualizar”.', 'bad'); return; }
    if (!confirm('Esto publicará los cambios en sionbook.com (Vercel tarda 1–2 minutos en mostrarlos). ¿Continuar?')) return;
    btn.disabled = true; btn.textContent = 'Publicando…';
    try {
      const r = await api('/api/publish', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message: msg.value }) });
      out.style.display = 'block'; out.textContent = r.log || '';
      toast(r.ok ? 'Publicado. En 1–2 minutos estará en sionbook.com' : 'No se pudo publicar. Mira el detalle abajo.', r.ok ? 'good' : 'bad');
      await refreshGit(); if (r.ok) render();
    } catch (e) { toast(e.message, 'bad'); }
    btn.disabled = false; btn.textContent = 'Publicar en sionbook.com';
  } }, 'Publicar en sionbook.com');
  const wrap = h('div', { class: 'card' },
    h('h2', {}, 'Publicar en sionbook.com'),
    h('p', {}, 'Cuando estés conforme con cómo se ve en la vista previa (', h('a', { href: 'http://localhost:3000', target: '_blank' }, 'localhost:3000'), '), publica. Los cambios se guardan en GitHub y Vercel actualiza la web sola.'),
    git ? h('div', { class: 'stat' }, h('div', {}, h('b', {}, git.changes), 'archivos con cambios'), h('div', {}, h('b', {}, git.ahead), 'versiones aún sin publicar'), h('div', {}, 'Última versión', h('b', { style: 'font-size:14px' }, git.last || '—'))) : null,
    h('label', { class: 'f' }, 'Nota de esta actualización ', h('span', { class: 'hint' }, '(opcional)'), msg),
    h('div', { style: 'margin-top:14px' }, btn), out);
  return wrap;
}

/* ---------- render ---------- */
function renderBand() {
  const band = $('#modeband'); if (!band || !data) return;
  const texts = {
    books: [`Estás editando el sitio en `, LANG_TITLE[L], ` — aquí ves solo los libros de ese idioma, lo que ya tienen y lo que falta.`],
    upcoming: [`Estás editando el sitio en `, LANG_TITLE[L], ` — solo las próximas obras que se muestran en ese idioma.`],
    site: [`Estás editando el sitio en `, LANG_TITLE[L], ` — los textos de la editorial y de contacto en ese idioma.`],
    map: ['Comparando los dos idiomas', '', ' — cuántas páginas tiene cada sitio y qué existe en uno solo.'],
    publish: ['Publicar', '', ' — afecta a los dos idiomas a la vez.']
  }[tab] || ['', '', ''];
  band.replaceChildren(texts[0], h('b', {}, texts[1]), texts[2]);
  const cross = tab === 'map' || tab === 'publish';
  band.style.setProperty('--lc', cross ? 'var(--blue)' : ''); band.style.background = cross ? '#eef2ff' : '';
  document.getElementById('langsw').style.opacity = cross ? '.55' : '';
}
function render() {
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  syncLangUI(); renderBand();
  view.replaceChildren();
  if (tab === 'books' || tab === 'upcoming') {
    const vis = visible(tab); if (vis.length && !vis.includes(sel[tab])) sel[tab] = vis[0];
    view.append(h('div', { class: 'layout' }, listPane(tab), editor(tab)));
    renderList();
  } else if (tab === 'map') view.append(mapView());
  else if (tab === 'site') view.append(siteView());
  else view.append(publishView());
}

$('#tabs').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; if (tab === 'publish') await refreshGit(); render();
});

$('#save').addEventListener('click', async () => {
  if (cloud && !confirm('Esto publica los cambios en sionbook.com (Vercel tarda 1–2 minutos en mostrarlos). ¿Continuar?')) return;
  const btn = $('#save'); const label = btn.textContent; btn.disabled = true; btn.textContent = cloud ? 'Publicando…' : 'Guardando…';
  try {
    // Los textos numéricos se guardan como números; los campos vacíos opcionales se quitan
    const payload = JSON.parse(JSON.stringify(data));
    for (const b of payload.books) for (const k of ['year', 'pages']) { if (b[k] === '' || b[k] == null) b[k] = ''; else if (!isNaN(b[k])) b[k] = Number(b[k]); }
    if (cloud) { payload.etag = etag; payload.covers = pending; }
    const r = await api('/api/save', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error(r.error || r.log || 'No se pudo guardar');
    data.books.forEach((b) => { delete b._new; }); data.upcoming.forEach((u) => { delete u._new; });
    markClean();
    if (cloud) {
      etag = r.etag; pending.length = 0;
      toast(r.unchanged ? 'No había cambios que publicar.' : 'Publicado. En 1–2 minutos estará en sionbook.com', r.unchanged ? '' : 'good');
    } else {
      lastLog = r.log;
      const warn = (r.log.match(/⚠[^\n]*/g) || []);
      toast(warn.length ? `Guardado. Avisos: ${warn.slice(0, 2).join(' · ')}` : 'Guardado. La vista previa ya está actualizada.', warn.length ? '' : 'good');
    }
  } catch (e) { toast(e.message, 'bad'); }
  btn.disabled = false; btn.textContent = label;
});

/* ---------- acceso (solo en sionbook.com/admin) ---------- */
function renderLogin(msg) {
  const email = h('input', { type: 'email', autocomplete: 'username', required: true });
  const pass = h('input', { type: 'password', autocomplete: 'current-password', required: true });
  const err = h('p', { class: 'err', role: 'alert' }, msg || '');
  const btn = h('button', { class: 'primary', type: 'submit', style: 'width:100%;justify-content:center;margin-top:14px' }, 'Entrar');
  const form = h('form', { class: 'card login', onsubmit: async (e) => {
    e.preventDefault(); btn.disabled = true; err.textContent = '';
    try {
      const r = await api('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: email.value, password: pass.value }) });
      if (!r.ok) throw new Error(r.error);
      pass.value = ''; await start();
    } catch (x) { err.textContent = x.message; btn.disabled = false; pass.value = ''; pass.focus(); }
  } },
    h('h2', {}, 'Entrar al panel'),
    h('label', { class: 'f' }, 'Correo', email), h('label', { class: 'f' }, 'Contraseña', pass), btn, err);
  view.replaceChildren(form); email.focus();
}
function renderNotConfigured(s) {
  view.replaceChildren(h('div', { class: 'card login' }, h('h2', {}, 'Falta configurar el acceso'),
    h('p', {}, 'El panel está instalado, pero todavía faltan estas variables en Vercel:'),
    h('pre', {}, (s.missing || []).join('\n')),
    h('p', { class: 'note' }, 'Sigue el paso a paso del README (sección “Panel en sionbook.com/admin”) y vuelve a desplegar.')));
}
function applyMode(s) {
  cloud = s.mode === 'cloud';
  const showChrome = !cloud || !!s.authenticated;
  $('#langsw').hidden = !showChrome; $('#modeband').hidden = !showChrome;
  if (!cloud) return;
  $('#site-link').href = 'https://www.sionbook.com';
  $('#save').textContent = 'Guardar y publicar';
  document.querySelector('#tabs [data-tab="publish"]').hidden = true;
  if (s.authenticated) {
    $('#who').hidden = false; $('#who').textContent = s.email; $('#logout').hidden = false;
  } else { $('#save').hidden = true; $('#state').hidden = true; $('#tabs').hidden = true; }
}
$('#logout').addEventListener('click', async () => {
  if (dirty && !confirm('Tienes cambios sin guardar. ¿Salir igualmente?')) return;
  try { await api('/api/logout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); } catch {}
  dirty = false; location.reload();
});

document.querySelectorAll('#langsw button').forEach((b) => b.addEventListener('click', () => { if (L !== b.dataset.l) setLang(b.dataset.l); }));

async function start() {
  const s = await api('/api/session');
  applyMode(s);
  if (cloud && !s.configured) return renderNotConfigured(s);
  if (cloud && !s.authenticated) return renderLogin();
  if (cloud) { $('#save').hidden = false; $('#state').hidden = false; $('#tabs').hidden = false; }
  data = await api('/api/data');
  etag = data.etag || null;
  data.books.forEach((b) => { if (!Array.isArray(b.languages)) b.languages = [...BOTH]; });
  data.upcoming.forEach((u) => { if (!Array.isArray(u.languages)) u.languages = [...BOTH]; });
  render();
}
start().catch((e) => { view.replaceChildren(h('div', { class: 'card login' }, h('h2', {}, 'No se pudo abrir el panel'), h('p', {}, e.message))); });
